<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대진표 메이커</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#172033;--muted:#68758b;--accent:#315efb;--line:#dce3ef;--win:#e8f7ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
header{background:linear-gradient(120deg,#203b85,#4776f5);color:white;padding:28px 18px}
.wrap{max-width:1200px;margin:auto;padding:0 16px}h1{margin:0 0 6px;font-size:clamp(25px,4vw,36px)}header p{margin:0;opacity:.9}
main{max-width:1200px;margin:22px auto;padding:0 16px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 5px 18px #18294b0a}
h2{font-size:19px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
textarea{width:100%;min-height:190px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;line-height:1.6}
.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:12px}
button{border:0;border-radius:10px;padding:11px 15px;font:600 14px inherit;cursor:pointer;background:#edf1fa;color:var(--ink)}
button.primary{background:var(--accent);color:#fff}button.danger{background:#fff0f0;color:#b42318}button:disabled{opacity:.45;cursor:not-allowed}
input[type=text]{border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit;min-width:180px}
.hint{font-size:13px;color:var(--muted);line-height:1.5}.status{font-size:13px;color:var(--muted);margin-left:auto}
.bracket-scroll{overflow-x:auto;padding:8px 2px 18px}
#bracket{display:flex;gap:22px;align-items:stretch;min-width:max-content}
.round{display:flex;flex-direction:column;min-width:205px;width:205px}
.round h3{font-size:14px;color:var(--muted);margin:0 0 12px;text-align:center}
.matches{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:18px}
.match{background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px;box-shadow:0 2px 8px #18294b08}
.slot{display:flex;align-items:center;gap:7px;padding:8px;border-radius:7px;min-height:37px;background:#f7f9fc;font-size:14px}
.slot+.slot{margin-top:5px}.slot.winner{background:var(--win);font-weight:700}
.slot input{width:100%;min-width:0;border:0;background:transparent;outline:none;font:inherit;color:inherit}
.slot .seed{font-size:11px;color:var(--muted);min-width:17px}
.slot button{padding:4px 7px;font-size:11px;white-space:nowrap}
.empty{color:#9aa5b5}
@media(max-width:760px){.grid{grid-template-columns:1fr}.status{width:100%;margin:0}}
@media print{header{background:#fff;color:#111;padding:10px 0}.panel.setup,.no-print{display:none!important}body{background:white}.panel{box-shadow:none;border:0;padding:0}main{margin:0;max-width:none}.bracket-scroll{overflow:visible}#bracket{transform-origin:top left;gap:12px}.round{min-width:175px;width:175px}.match{break-inside:avoid}}
</style>
</head>
<body>
<header><div class="wrap"><h1>🏆 대진표 메이커</h1><p>참가 팀을 입력하고 대진표를 만든 뒤, 경기 결과를 선택해 우승팀까지 진행하세요.</p></div></header>
<main>
<section class="panel setup">
 <div class="grid">
  <div><h2>① 대회 정보</h2><input id="eventName" type="text" placeholder="대회 이름 (예: 학년별 농구 대회)" style="width:100%"><p class="hint">참가 팀은 한 줄에 하나씩 입력하세요. 최소 2팀이 필요합니다.</p></div>
  <div><h2>② 참가 팀 목록</h2><textarea id="teams" placeholder="1반&#10;2반&#10;3반&#10;4반"></textarea></div>
 </div>
 <div class="controls">
  <button class="primary" id="makeBtn">대진표 만들기</button><button id="shuffleBtn">팀 순서 섞기</button><button id="sampleBtn">예시 입력</button>
  <span class="status" id="status">아직 대진표가 없습니다.</span>
 </div>
 <p class="hint">※ 참가 팀 수가 2의 거듭제곱이 아니면 일부 팀은 부전승으로 진출합니다. 준결승이 있는 대회는 3·4위전도 자동으로 생성됩니다.</p>
</section>
<section class="panel">
 <div class="controls no-print" style="margin-top:0;margin-bottom:14px">
  <h2 style="margin:0">대진표</h2><span class="status" id="eventTitle"></span>
  <button onclick="window.print()">인쇄 / PDF 저장</button><button id="resetBtn" class="danger">대진표 초기화</button>
 </div>
 <div class="bracket-scroll"><div id="bracket"><p class="hint">위에서 참가 팀을 입력하고 ‘대진표 만들기’를 눌러주세요.</p></div></div>
</section>
</main>
<script>
let rounds=[];
let thirdPlace=[null,null], thirdWinner=null;
const $=id=>document.getElementById(id);
function nextPow2(n){let p=1;while(p<n)p*=2;return p}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeBracket(){
 let names=$('teams').value.split(/\n/).map(x=>x.trim()).filter(Boolean);
 if(names.length<2){alert('참가 팀을 2팀 이상 입력해주세요.');return}
 if(names.length>128){alert('현재 버전은 최대 128팀까지 지원합니다.');return}
 let size=nextPow2(names.length), slots=Array(size).fill(null);
 // Place teams in order; remaining slots become byes.
 names.forEach((n,i)=>slots[i]=n);
 rounds=[{matches:[]}]; thirdPlace=[null,null]; thirdWinner=null;
 for(let i=0;i<size;i+=2)rounds[0].matches.push([slots[i],slots[i+1]]);
 let count=size/2;
 while(count>1){let arr=[];for(let i=0;i<count/2;i++)arr.push([null,null]);rounds.push({matches:arr});count/=2}
 // Resolve automatic byes
 for(let r=0;r<rounds.length;r++)for(let m=0;m<rounds[r].matches.length;m++){
  let pair=rounds[r].matches[m];
  if(r===0 && (pair[0]===null || pair[1]===null)){
   let winner=pair[0]||pair[1]; if(winner) putWinner(r,m,winner);
  }
 }
 render();
}
function putWinner(r,m,winner){
 if(r+1>=rounds.length)return;
 let nextMatch=Math.floor(m/2),slot=m%2;
 rounds[r+1].matches[nextMatch][slot]=winner;
 // if next round has one automatic bye, propagate
 let p=rounds[r+1].matches[nextMatch];
 if((p[0]===null)!==(p[1]===null)){
  let w=p[0]||p[1];putWinner(r+1,nextMatch,w);
 }
}
function chooseWinner(r,m,slot){
 let pair=rounds[r].matches[m],name=pair[slot];
 if(!name){alert('아직 참가 팀이 정해지지 않은 자리입니다.');return}
 pair._winner=slot;
 // 준결승 패자는 3·4위전 참가팀으로 자동 등록
 const semiRound=rounds.length-2;
 if(rounds.length>=2 && r===semiRound){
  thirdPlace[m]=pair[1-slot];
  thirdWinner=null;
 }
 if(r+1<rounds.length){
  let nm=Math.floor(m/2),ns=m%2;
  rounds[r+1].matches[nm][ns]=name;
  rounds[r+1].matches[nm]._winner=undefined;
  // Clear downstream winners when an earlier result changes
  for(let rr=r+2;rr<rounds.length;rr++)for(let mm=0;mm<rounds[rr].matches.length;mm++){rounds[rr].matches[mm]=[null,null];rounds[rr].matches[mm]._winner=undefined}
  // Propagate an automatic bye only when the other slot is truly empty
  let p=rounds[r+1].matches[nm];
  if((p[0]===null)!==(p[1]===null))putWinner(r+1,nm,p[0]||p[1]);
 }
 render();
}
function render(){
 const root=$('bracket');root.innerHTML='';
 const title=$('eventName').value.trim();$('eventTitle').textContent=title||'토너먼트';
 rounds.forEach((round,r)=>{
  let col=document.createElement('div');col.className='round';
  let h=document.createElement('h3');h.textContent=r===rounds.length-1?'결승':`${r+1}라운드`;col.appendChild(h);
  let matches=document.createElement('div');matches.className='matches';
  round.matches.forEach((pair,m)=>{
   let box=document.createElement('div');box.className='match';
   pair.forEach((team,s)=>{
    let row=document.createElement('div');row.className='slot'+(pair._winner===s?' winner':'');
    let seed=document.createElement('span');seed.className='seed';seed.textContent=team?'':'—';row.appendChild(seed);
    let label=document.createElement('span');label.style.flex='1';label.className=team?'':'empty';label.textContent=team||'대기 중';row.appendChild(label);
    if(team && r<rounds.length-1){let b=document.createElement('button');b.textContent='승리';b.onclick=()=>chooseWinner(r,m,s);row.appendChild(b)}
    box.appendChild(row);
   });
   matches.appendChild(box);
  });col.appendChild(matches);root.appendChild(col);
 });
 if(rounds.length>=2){
  const section=document.createElement('div');section.className='round';
  const heading=document.createElement('h3');heading.textContent='3·4위전';section.appendChild(heading);
  const matches=document.createElement('div');matches.className='matches';
  const box=document.createElement('div');box.className='match';
  thirdPlace.forEach((team,s)=>{
   const row=document.createElement('div');row.className='slot'+(thirdWinner===s?' winner':'');
   const seed=document.createElement('span');seed.className='seed';seed.textContent=team?'':'—';row.appendChild(seed);
   const label=document.createElement('span');label.style.flex='1';label.className=team?'':'empty';label.textContent=team||'준결승 결과 대기';row.appendChild(label);
   if(team && thirdPlace[0] && thirdPlace[1]){
    const b=document.createElement('button');b.textContent='3위';b.onclick=()=>{thirdWinner=s;render()};row.appendChild(b);
   }
   box.appendChild(row);
  });
  matches.appendChild(box);section.appendChild(matches);root.appendChild(section);
 }
 let total=rounds[0].matches.length;$('status').textContent=`${$('teams').value.split(/\n/).filter(x=>x.trim()).length}팀 참가 · ${rounds.length}라운드`;
}
$('makeBtn').onclick=makeBracket;
$('shuffleBtn').onclick=()=>{$('teams').value=shuffle($('teams').value.split(/\n/).map(x=>x.trim()).filter(Boolean)).join('\n')};
$('sampleBtn').onclick=()=>{$('teams').value='1반\n2반\n3반\n4반\n5반\n6반\n7반\n8반'};
$('resetBtn').onclick=()=>{if(confirm('대진표를 초기화할까요?')){rounds=[];thirdPlace=[null,null];thirdWinner=null;$('bracket').innerHTML='<p class="hint">위에서 참가 팀을 입력하고 ‘대진표 만들기’를 눌러주세요.</p>';$('status').textContent='대진표가 초기화되었습니다.'}};
</script>
</body></html>
